<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            width: 300px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e4e4e7;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo {
            font-size: 32px;
            margin-bottom: 8px;
        }
        
        .title {
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .status-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .status-row:last-child {
            margin-bottom: 0;
        }
        
        .status-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }
        
        .status-value {
            font-weight: 500;
            font-size: 13px;
        }
        
        .status-active {
            color: #10b981;
        }
        
        .status-inactive {
            color: #f43f5e;
        }
        
        .indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        
        .indicator.active {
            background: #10b981;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
        }
        
        .indicator.inactive {
            background: #f43f5e;
            box-shadow: 0 0 8px rgba(244, 63, 94, 0.6);
        }
        
        .toggle-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .toggle-btn.pause {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }
        
        .toggle-btn.resume {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .toggle-btn:hover {
            transform: translateY(-1px);
        }
        
        .privacy-note {
            margin-top: 16px;
            padding: 12px;
            background: rgba(99, 102, 241, 0.1);
            border-radius: 8px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
        }
        
        .privacy-note strong {
            color: #818cf8;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">📊</div>
        <div class="title">Activity Tracker</div>
    </div>
    
    <div class="status-card">
        <div class="status-row">
            <span class="status-label">Tracking Status</span>
            <span id="tracking-status" class="status-value">
                <span class="indicator active"></span>
                <span>Active</span>
            </span>
        </div>
        <div class="status-row">
            <span class="status-label">Current Site</span>
            <span id="current-domain" class="status-value">—</span>
        </div>
        <div class="status-row">
            <span class="status-label">Buffered Records</span>
            <span id="buffer-size" class="status-value">0</span>
        </div>
    </div>
    
    <button id="toggle-btn" class="toggle-btn pause">
        Pause Tracking
    </button>
    
    <div class="privacy-note">
        <strong>🔒 Privacy:</strong> Only domain names are tracked.<br>
        No page content, URLs, or personal data.
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
